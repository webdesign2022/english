<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 全城尋寶戰：最終完賽挑戰</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        /* --- 1. 全局與基礎設定 --- */
        body { font-family: 'Microsoft JhengHei', sans-serif; margin: 0; padding: 0; background: #000; color: white; overflow: hidden; }
        #map { height: 100vh; width: 100%; z-index: 1; opacity: 0; transition: opacity 1s; } 
        
        /* --- 2. 號碼布樣式 (動態合成的核心) --- */
        .bib-card {
            position: relative;
            width: 100%; aspect-ratio: 4/3;
            background-color: #222;
            border-radius: 10px; overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border: 2px solid #555;
            display: flex; flex-direction: column; justify-content: space-between;
            transition: all 0.5s;
        }

        /* 浮水印照片層 (最底層) */
        .bib-layer-photo {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0.25; /* 浮水印效果：透明度低 */
            filter: grayscale(0.3) contrast(1.2); 
            z-index: 0; display: none;
        }

        /* 紋理層 */
        .bib-layer-bg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; z-index: 1; opacity: 0.6; mix-blend-mode: screen;
        }

        /* 內容層 (文字與圖騰) */
        .bib-content {
            position: relative; z-index: 10;
            height: 100%; display: flex; flex-direction: column;
            padding: 15px; box-sizing: border-box; justify-content: space-between;
        }

        .bib-header {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.9rem; font-weight: bold; text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            border-bottom: 2px solid rgba(255,255,255,0.3); padding-bottom: 5px;
        }

        /* 圖騰展示區 */
        .totem-grid {
            display: flex; justify-content: center; gap: 10px; align-items: center;
            flex-grow: 1; margin: 10px 0;
        }
        .totem-slot {
            width: 55px; height: 55px;
            border-radius: 50%;
            border: 2px dashed rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.4);
            display: flex; justify-content: center; align-items: center;
            transition: all 0.5s;
        }
        .totem-slot img { width: 70%; height: 70%; object-fit: contain; opacity: 0.3; filter: grayscale(1); transition: 0.5s; }
        
        .totem-slot.unlocked {
            border: 2px solid #fff;
            background: rgba(255,255,255,0.1);
            box-shadow: 0 0 15px currentColor;
        }
        .totem-slot.unlocked img { opacity: 1; filter: none; transform: scale(1.1); }

        .bib-footer { text-align: center; }
        .bib-number {
            font-family: 'Arial Black', sans-serif;
            font-size: 3.5rem; line-height: 1;
            font-weight: 900; letter-spacing: 2px;
            text-shadow: 4px 4px 0px rgba(0,0,0,0.8);
            margin: 0;
        }
        .bib-quote {
            font-size: 1rem; font-weight: bold;
            background: rgba(0,0,0,0.6);
            display: inline-block; padding: 4px 15px; border-radius: 20px;
            margin-top: 5px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* --- 3. 隨機主題樣式 --- */
        /* Neon */
        .theme-neon .bib-card { border-color: #00ffcc; }
        .theme-neon .bib-number { color: #00ffcc; }
        .theme-neon .bib-header { color: #00ffcc; }
        .theme-neon .totem-slot.unlocked { color: #00ffcc; }

        /* Fire */
        .theme-fire .bib-card { border-color: #ffaa00; }
        .theme-fire .bib-number { background: -webkit-linear-gradient(#ffaa00, #ff3300); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .theme-fire .bib-header { color: #ffaa00; }
        .theme-fire .totem-slot.unlocked { color: #ff3300; }

        /* Ocean */
        .theme-ocean .bib-card { border-color: #00ccff; }
        .theme-ocean .bib-number { color: #fff; text-shadow: 0 0 15px #00ccff; }
        .theme-ocean .bib-header { color: #00ccff; }
        .theme-ocean .totem-slot.unlocked { color: #00ccff; }

        /* --- 4. 介面與互動元素 --- */
        .hud-panel {
            position: absolute; bottom: 0; left: 0; width: 100%; 
            background: linear-gradient(to top, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 100%);
            padding: 20px; box-sizing: border-box; z-index: 100;
            text-align: center; display: none;
        }
        .mini-bib-wrapper { width: 100px; margin: 0 auto 10px auto; pointer-events: none; }
        
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        
        /* 刮刮樂區域 */
        .scratch-card { width: 280px; height: 280px; background: #fff; border-radius: 10px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; margin-bottom: 20px;}
        
        /* 驗證輸入框區域 */
        .quiz-box { width: 100%; max-width: 320px; background: #222; padding: 20px; border-radius: 10px; border: 1px solid #00ffcc; text-align: center; }
        .input-code { width: 100%; padding: 15px; font-size: 1.2rem; text-align: center; margin: 15px 0; background: #000; color: #00ffcc; border: 1px solid #333; letter-spacing: 2px; text-transform: uppercase;}
        
        .btn { width: 100%; max-width: 300px; padding: 15px; border-radius: 50px; border: none; font-weight: bold; font-size: 1.1rem; cursor: pointer; transition: 0.3s; margin-top: 10px;}
        .btn.active { background: #ff0055; color: white; box-shadow: 0 0 15px rgba(255,0,85,0.5); }
        .btn:disabled { background: #444; color: #888; cursor: not-allowed; }

        /* 測試按鈕 */
        .debug-zone { position: fixed; top: 10px; right: 10px; display: none; flex-direction: column; gap: 5px; z-index: 3000; }
        .debug-btn { padding: 5px 10px; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid #555; cursor: pointer; }
    </style>
</head>
<body>

    <div id="landing-page" class="overlay" style="display:flex; background: linear-gradient(135deg, #111 0%, #333 100%);">
        <h1 style="color:#00ffcc; font-size:2rem; margin-bottom:10px;">2026 全城尋寶戰</h1>
        <p style="color:#aaa; text-align:center; line-height:1.6; max-width: 300px;">
            <span style="color:#fff;">任務目標：</span><br>
            1. 前往 <span style="color:#ffaa00;">3個檢查點</span> 刮開圖騰<br>
            2. 抵達 <span style="color:#ff0055;">終點站</span> 驗證通關密語<br>
            3. 現場上傳照片生成號碼布
        </p>
        <button class="btn active" onclick="startGame()">🚀 啟動任務</button>
    </div>

    <div id="map"></div>

    <div id="debug-zone" class="debug-zone">
        <button class="debug-btn" onclick="test_jump()">⚡ 跳到下一關</button>
        <button class="debug-btn" onclick="test_reset()">🔴 重置進度</button>
    </div>

    <div class="hud-panel" id="hud-panel">
        <div id="mini-bib-container" class="mini-bib-wrapper"></div>
        <div class="status-title" id="hud-title" style="color:#00ffcc; font-weight:bold; font-size:1.2rem;">連線中...</div>
        <div class="status-desc" id="hud-desc" style="color:#ccc; font-size:0.9rem; margin-bottom:15px;">等待 GPS 定位</div>
        <button id="action-btn" class="btn" disabled>🔒 移動中...</button>
    </div>

    <div id="overlay-scratch" class="overlay">
        <h2 style="color:#ffaa00;">✨ 抵達檢查點！</h2>
        <p style="color:#aaa;">刮開下方銀漆取得圖騰</p>
        <div class="scratch-card">
            <div style="position:absolute; width:100%; text-align:center; z-index:1;">
                <img id="scratch-prize-img" src="" style="width:100px; height:100px; margin-bottom:10px;"><br>
                <span id="scratch-prize-name" style="color:#ff0055; font-size:1.5rem; font-weight:bold;">圖騰</span>
            </div>
            <canvas id="scratch-canvas" width="280" height="280" style="position:relative; z-index:2; cursor:crosshair;"></canvas>
        </div>
        <button id="scratch-claim-btn" class="btn active" style="display:none;" onclick="completeStation()">📥 收集圖騰</button>
    </div>

    <div id="overlay-finish-check" class="overlay">
        <h2 style="color:#00ffcc;">🏁 終點站驗證</h2>
        <p style="color:#ccc;">請掃描現場 QR Code 並輸入通關密語</p>
        
        <div class="quiz-box">
            <label style="font-size:0.8rem; color:#aaa;">EVENT THEME NAME</label>
            <input type="text" id="finish-input" class="input-code" placeholder="輸入活動主題" autocomplete="off">
            <div id="finish-error" style="color:#ff0055; font-size:0.8rem; display:none; margin-bottom:10px;">❌ 密語錯誤，請確認現場海報</div>
            <button class="btn active" onclick="verifyFinish()">✅ 驗證並上傳照片</button>
        </div>
        <button class="btn" style="background:transparent; border:1px solid #555; color:#aaa; margin-top:20px; font-size:0.8rem;" onclick="closeFinishOverlay()">暫時離開</button>
    </div>

    <div id="overlay-upload" class="overlay" style="overflow-y:auto;">
        <h2 style="color:#fff;">🎉 驗證成功！</h2>
        <p style="color:#aaa; font-size:0.9rem;">最後一步：上傳照片完成製作</p>

        <div id="final-bib-container" style="width: 320px; margin: 10px 0;"></div>

        <div style="width:100%; max-width:320px; text-align:center;">
            <input type="text" id="user-quote" class="input-code" style="padding:10px; font-size:1rem; margin-bottom:10px;" placeholder="輸入一句話 (如: 完賽啦!)" maxlength="10" oninput="updatePreviewText()">
            
            <label for="photo-input" class="btn active" style="background:#333; border:1px solid #555; color:#fff; display:block; margin-bottom:10px;">📷 選擇照片 / 拍照</label>
            <input type="file" id="photo-input" accept="image/*" style="display:none;" onchange="handlePhoto(this)">
            
            <button id="generate-btn" class="btn active" onclick="generateFinalImage()" disabled>✨ 生成號碼布</button>
        </div>
    </div>

    <div id="overlay-result" class="overlay">
        <h1 style="color:#00ffcc;">MISSION COMPLETE</h1>
        <p style="color:#fff; font-size:0.9rem;">長按圖片即可儲存</p>
        <div id="result-img-area" style="margin: 20px 0; border: 2px solid #fff; border-radius:10px;"></div>
        <button class="btn active" onclick="location.reload()">🔄 回到首頁</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script>
        // ================= 配置區 =================
        // 為了演示方便，這裡設定一個固定的答案
        const CORRECT_ANSWER = "2026"; 

        // 關卡資料：前3關是尋寶，第4關是終點
        const STATIONS = [
            { 
                lat: 25.0405, lng: 121.4485, name: "第1站：女王頭", 
                type: "scratch", totem: "女王頭", img: "https://placehold.co/100x100/222/00ffcc?text=Queen",
                hint: "去公園入口找女王頭", desc: "獲得【女王頭】圖騰！"
            },
            { 
                lat: 25.0415, lng: 121.4495, name: "第2站：Logo", 
                type: "scratch", totem: "活動Logo", img: "https://placehold.co/100x100/222/ffaa00?text=LOGO",
                hint: "前往噴水池廣場", desc: "獲得【活動Logo】圖騰！"
            },
            { 
                lat: 25.0435, lng: 121.4515, name: "第3站：金標", 
                type: "scratch", totem: "金標認證", img: "https://placehold.co/100x100/222/00ccff?text=Gold",
                hint: "前往運動場看台", desc: "獲得【金標認證】圖騰！"
            },
            { 
                lat: 25.0440, lng: 121.4520, name: "終點：服務台", 
                type: "finish", totem: "完賽證明", img: "",
                hint: "前往服務台掃碼驗證", desc: "請掃描桌上QR Code"
            }
        ];

        const THEMES = ['theme-neon', 'theme-fire', 'theme-ocean'];
        
        // ================= 狀態管理 =================
        let state = {
            step: 0, // 0, 1, 2, 3(終點), 4(完成)
            theme: 'theme-neon',
            bibId: 'A-0001',
            photoUrl: null,
            quote: 'RUNNER'
        };
        let map, userMarker, targetMarker;

        // ================= 初始化 =================
        function init() {
            // 讀取進度
            if(localStorage.getItem('game_step')) state.step = parseInt(localStorage.getItem('game_step'));
            if(localStorage.getItem('game_theme')) state.theme = localStorage.getItem('game_theme');
            else {
                state.theme = THEMES[Math.floor(Math.random() * THEMES.length)];
                localStorage.setItem('game_theme', state.theme);
            }
            // 產生假號碼
            if(!localStorage.getItem('game_bib')) localStorage.setItem('game_bib', 'F-' + Math.floor(Math.random()*9000+1000));
            state.bibId = localStorage.getItem('game_bib');

            document.body.className = state.theme;
        }

        function startGame() {
            document.getElementById('landing-page').style.display = 'none';
            document.getElementById('hud-panel').style.display = 'block';
            document.getElementById('debug-zone').style.display = 'flex';
            document.getElementById('map').style.opacity = '1';
            
            initMap();
            renderBib('mini-bib-container'); // HUD 小圖
            updateGameLoop(0); // 模擬一開始距離很遠
        }

        // ================= 地圖邏輯 =================
        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([25.0415, 121.4495], 16);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);
            
            userMarker = L.marker([0,0]).addTo(map);
            
            if(navigator.geolocation) {
                navigator.geolocation.watchPosition((pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    userMarker.setLatLng([lat, lng]);
                    
                    if(state.step < STATIONS.length) {
                        const target = STATIONS[state.step];
                        const dist = map.distance([lat, lng], [target.lat, target.lng]);
                        updateGameLoop(dist);
                        
                        // 更新目標點 Marker
                        if(!targetMarker) targetMarker = L.marker([target.lat, target.lng]).addTo(map);
                        else targetMarker.setLatLng([target.lat, target.lng]);
                    }
                }, (err)=>console.warn(err), {enableHighAccuracy:true});
            }
        }

        // ================= 遊戲迴圈 UI 更新 =================
        function updateGameLoop(dist) {
            const title = document.getElementById('hud-title');
            const desc = document.getElementById('hud-desc');
            const btn = document.getElementById('action-btn');

            if (state.step >= STATIONS.length) {
                // 全部完成
                title.innerText = "🎉 任務全數完成";
                desc.innerText = "您已獲得完賽證明";
                btn.style.display = 'none';
                return;
            }

            const currentStation = STATIONS[state.step];

            // 判斷是否到達 (測試用寬鬆判定 30m)
            const isArrived = dist < 30;

            if (isArrived) {
                btn.disabled = false;
                btn.className = "btn active";
                title.innerText = `📍 抵達：${currentStation.name}`;
                desc.innerText = "訊號鎖定！準備互動";

                if (currentStation.type === 'scratch') {
                    btn.innerText = "🖐 刮刮樂";
                    btn.onclick = showScratchCard;
                } else if (currentStation.type === 'finish') {
                    btn.innerText = "📱 掃描 QR Code";
                    btn.onclick = showFinishCheck;
                }
            } else {
                // 移動中
                btn.disabled = true;
                btn.className = "btn";
                title.innerText = `前往：${currentStation.name}`;
                desc.innerText = `距離 ${Math.round(dist)} 公尺 - ${currentStation.hint}`;
                btn.innerText = "🔒 移動中...";
            }
            
            renderBib('mini-bib-container'); // 確保小圖狀態即時
        }

        // ================= 互動：刮刮樂 (前3關) =================
        function showScratchCard() {
            const station = STATIONS[state.step];
            document.getElementById('overlay-scratch').style.display = 'flex';
            document.getElementById('scratch-prize-img').src = station.img;
            document.getElementById('scratch-prize-name').innerText = station.totem;
            
            // Canvas 設定
            const c = document.getElementById('scratch-canvas');
            const ctx = c.getContext('2d');
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#C0C0C0'; ctx.fillRect(0,0,280,280);
            
            let scratched = 0;
            let isDrawing = false;
            
            const draw = (x,y) => {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath(); ctx.arc(x,y,20,0,Math.PI*2); ctx.fill();
                scratched++;
                if(scratched > 50) document.getElementById('scratch-claim-btn').style.display = 'block';
            }
            
            c.onmousemove = (e) => { if(e.buttons===1) { const r=c.getBoundingClientRect(); draw(e.clientX-r.left, e.clientY-r.top); }};
            c.ontouchmove = (e) => { const r=c.getBoundingClientRect(); draw(e.touches[0].clientX-r.left, e.touches[0].clientY-r.top); };
        }

        function completeStation() {
            alert(`恭喜收集到：${STATIONS[state.step].totem}`);
            document.getElementById('overlay-scratch').style.display = 'none';
            document.getElementById('scratch-claim-btn').style.display = 'none'; // 重置按鈕
            
            nextStep();
        }

        // ================= 互動：終點驗證 (第4關) =================
        function showFinishCheck() {
            document.getElementById('overlay-finish-check').style.display = 'flex';
        }

        function closeFinishOverlay() {
            document.getElementById('overlay-finish-check').style.display = 'none';
        }

        function verifyFinish() {
            const input = document.getElementById('finish-input').value.trim();
            // 這裡模擬驗證邏輯，實際上可對比後端或固定字串
            if (input === CORRECT_ANSWER || input === "2026") {
                document.getElementById('overlay-finish-check').style.display = 'none';
                // 進入最後上傳照片階段
                showUploadStage();
            } else {
                const err = document.getElementById('finish-error');
                err.style.display = 'block';
                err.innerText = "❌ 密語錯誤！提示：年份 (2026)";
            }
        }

        // ================= 最後階段：上傳照片與生成 =================
        function showUploadStage() {
            // 這時候 step 還沒 +1，因為要等照片上傳完才算真的結束
            document.getElementById('overlay-upload').style.display = 'flex';
            renderBib('final-bib-container'); // 繪製大張預覽
        }

        function handlePhoto(input) {
            if (input.files && input.files[0]) {
                state.photoUrl = URL.createObjectURL(input.files[0]);
                renderBib('final-bib-container'); // 重繪帶有照片的號碼布
                document.getElementById('generate-btn').disabled = false;
            }
        }

        function updatePreviewText() {
            state.quote = document.getElementById('user-quote').value || "RUNNER";
            renderBib('final-bib-container');
        }

        function generateFinalImage() {
            const target = document.querySelector('#final-bib-container .bib-card');
            
            // 先將狀態設為完成，這樣號碼布的「???」會變成真實號碼
            // 為了預覽正確，我們這裡暫時手動替換一下
            const numDiv = target.querySelector('.bib-number');
            numDiv.innerText = state.bibId;

            html2canvas(target, { scale: 2, useCORS: true, backgroundColor:null }).then(canvas => {
                document.getElementById('overlay-upload').style.display = 'none';
                document.getElementById('overlay-result').style.display = 'flex';
                
                const img = new Image();
                img.src = canvas.toDataURL("image/png");
                img.style.width = "100%";
                document.getElementById('result-img-area').appendChild(img);
                
                // 真正更新狀態
                nextStep(); 
            });
        }

        function nextStep() {
            state.step++;
            localStorage.setItem('game_step', state.step);
            updateGameLoop(999); // 刷新 UI
        }

        // ================= 核心：繪製號碼布 DOM =================
        function renderBib(containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            const card = document.createElement('div');
            card.className = 'bib-card';

            // 1. 底圖 (照片)
            if(state.photoUrl) {
                const photo = document.createElement('img');
                photo.className = 'bib-layer-photo';
                photo.src = state.photoUrl;
                photo.style.display = 'block';
                card.appendChild(photo);
            }

            // 2. 紋理
            const bg = document.createElement('div');
            bg.className = 'bib-layer-bg';
            card.appendChild(bg);

            // 3. 內容
            const content = document.createElement('div');
            content.className = 'bib-content';

            // Header
            const header = document.createElement('div');
            header.className = 'bib-header';
            header.innerHTML = `<span>2026 NEW TAIPEI</span><span>EXPO</span>`;
            content.appendChild(header);

            // Totems (根據 step 決定亮起幾個)
            // 前3個是圖騰站，第4個是終點
            const grid = document.createElement('div');
            grid.className = 'totem-grid';
            
            // 我們只顯示前3個圖騰 slot
            for(let i=0; i<3; i++) {
                const slot = document.createElement('div');
                const isUnlocked = state.step > i; // step 1 時 unlock index 0
                slot.className = `totem-slot ${isUnlocked ? 'unlocked' : ''}`;
                
                const img = document.createElement('img');
                img.src = STATIONS[i].img;
                slot.appendChild(img);
                grid.appendChild(slot);
            }
            content.appendChild(grid);

            // Footer
            const footer = document.createElement('div');
            footer.className = 'bib-footer';
            
            const num = document.createElement('div');
            num.className = 'bib-number';
            // 只有在上傳照片階段(準備生成) 或 已經完成時，才顯示號碼
            // 否則顯示虛線，保持神祕感
            const isFinalStage = document.getElementById('overlay-upload').style.display === 'flex';
            num.innerText = (state.step >= 3 || isFinalStage) ? state.bibId : "---";
            
            const quote = document.createElement('div');
            quote.className = 'bib-quote';
            quote.innerText = state.quote;

            footer.appendChild(num);
            footer.appendChild(quote);
            content.appendChild(footer);

            card.appendChild(content);
            container.appendChild(card);
        }

        // ================= 測試用 =================
        function test_jump() {
            if(state.step < STATIONS.length) {
                // 如果是跳到終點，直接模擬到達
                if(state.step === 3) {
                    updateGameLoop(10); 
                } else {
                    state.step++;
                    renderBib('mini-bib-container');
                    updateGameLoop(999);
                }
            }
        }
        function test_reset() {
            localStorage.clear();
            location.reload();
        }

        window.onload = init;
    </script>
</body>
</html>
