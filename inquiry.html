<body>

            <img src="assets/images/logo.png" alt="esui-得美醫用創新科技 Logo">
        </a>

        <button class="menu-toggle" aria-expanded="false" aria-controls="main-navigation">
            &#9776; </button>

        <div class="nav-links" id="main-navigation">

    <section class="content-section">
        <h2>📝 產品與合作詢問單</h2>
        <p>感謝您對我們的電漿治療系統感興趣。請填寫以下資訊，我們將有專人盡快與您聯繫並提供詳細資料。</p>
        
       <form class="inquiry-form" id="inquiryForm" action="send_mail.php" method="POST">
            
    <div class="form-group">
        <label for="name">姓名/聯絡人</label>
        <input type="text" id="name" name="name" required>
    </div>

    <div class="form-group">
        <label for="company">公司/機構名稱</label>
        <input type="text" id="company" name="company" required>
    </div>

    <div class="form-group">
        <label for="role">職稱</label>
        <input type="text" id="role" name="role" required>
    </div>

    <div class="form-group">
        <label for="email">電子郵件</label>
        <input type="email" id="email" name="email" required>
    </div>

    <div class="form-group">
        <label for="phone">聯絡電話</label>
        <input type="tel" id="phone" name="phone" required>
    </div>

    <div class="form-group">
        <label for="interest">感興趣的產品/類型</label>
        <select id="interest" name="interest" required>
            <option value="" disabled selected>請選擇...</option>
            <option value="P200">PlasmaHeal P200 旗艦機</option>
            <option value="P100">PlasmaHeal P100 便攜機</option>
            <option value="Consumables">耗材與配件</option>
            <option value="Partnership">經銷與合作</option>
            <option value="Other">其他</option>
        </select>
    </div>

    <div class="form-group">
        <label for="quantity">預計採購數量/合作規模</label>
        <input type="text" id="quantity" name="quantity" placeholder="例如：10台 / 區域獨家代理">
    </div>

    <div class="form-group">
        <label for="message">您的具體詢問事項 (例如：報價、臨床文獻、經銷條件)</label>
        <textarea id="message" name="message" rows="5" required></textarea>
    </div>

    <button type="submit" class="form-submit-btn">送出詢問單</button>

    <div id="form-message"></div>
</form>
    </section>

     <footer>
        <div class="footer-links">
            <a href="#">隱私權政策</a> | <a href="#">服務條款</a> | <a href="#">產品認證</a>
        </div>

    </footer>
    
    <script src="js/main.js"></script>
    <script>
        document.getElementById('inquiryForm').addEventListener('submit', function(event) {
            event.preventDefault(); // 阻止表單預設提交行為
            
            const form = event.target;
            const formData = new FormData(form);
            const messageDiv = document.getElementById('form-message');

            messageDiv.style.display = 'block';
            messageDiv.style.backgroundColor = '#fff3cd'; // 黃色提示
            messageDiv.style.color = '#856404';
            messageDiv.innerHTML = '正在發送中...';

            // -----------------------------------------------------------
            // *** 重要：以下為模擬 AJAX 提交，請將此處替換為實際的後端 API 呼叫 ***
            // -----------------------------------------------------------
            
            fetch(form.action, {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (response.ok) {
                    return response.text();
                }
                throw new Error('伺服器錯誤: ' + response.statusText);
            })
            .then(result => {
                // 假設後端 (send_mail.php) 成功返回
                messageDiv.style.backgroundColor = '#d4edda'; // 綠色成功
                messageDiv.style.color = '#155724';
                messageDiv.innerHTML = '✅ 感謝您的詢問！您的訊息已發送至 audihus0803@gmail.com。';
                form.reset(); // 清空表單
            })
            .catch(error => {
                // 假設後端 (send_mail.php) 發送失敗
                console.error('Error:', error);
                messageDiv.style.backgroundColor = '#f8d7da'; // 紅色失敗
                messageDiv.style.color = '#721c24';
                messageDiv.innerHTML = '❌ 抱歉，發送失敗！請直接寄信至 audihus0803@gmail.com 聯繫。';
            });
            
            // -----------------------------------------------------------
            // *** 結束模擬區塊 ***
            // -----------------------------------------------------------
        });
    </script>

</body>

</html>
